# Não deixa o PipeWire pôr em repouso a saída Bluetooth (nem o equalizador da Cassandra) quando fica em silêncio.
# Sem isso, cada som novo precisa "acordar" o canal Bluetooth da caixa (~0,5–1 s) e sons curtos — como o bip
# de ativação — se perdem. Vai em ~/.config/wireplumber/wireplumber.conf.d/ (depois: systemctl --user restart wireplumber).
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
 # (o equalizador da Cassandra já nasce com session.suspend-timeout-seconds = 0 — ver cassandra/bt_audio.py)
